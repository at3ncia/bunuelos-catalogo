[build]
  command = "npm run build"
  publish = "dist"
  # Solo se compila producción (main). Vistas previas de PR y ramas se saltan para no gastar
  # créditos: la revisión se hace con las capturas automáticas de GitHub (revision.yml).
  # "exit 0" = no compilar; "exit 1" = compilar.
  ignore = 'if [ "$CONTEXT" = "production" ]; then exit 1; else exit 0; fi'

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: todas las rutas van a index.html para que React Router las maneje
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
